name: Fetch gists

on:
  schedule:
    # UTC 19:30 = 翌日 JST 04:30, 3日ごと(JST で毎月 2,5,8,...日)。月替わりで間隔が 1〜3 日にずれることがある
    - cron: "30 19 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-gists
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Actions の GITHUB_TOKEN は Gist API にアクセスできない(403)ので使わない。
      # レート制限対策に PAT を使う場合は secrets.GIST_TOKEN に設定する(スコープ不要)
      - name: Fetch latest gists
        run: python gists.py
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Commit and push if changed
        id: commit
        run: |
          git add raw
          if git diff --cached --quiet; then
            echo "no changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update gists ($(date -u +%Y-%m-%d))"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN による push は on: push を発火させないため、明示的に Pages ビルドを起動する
      - name: Trigger Pages build
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run pages.yml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
